<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio - Eslam Salah</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Eslam Mohamed Salah - Full Stack .NET Developer specializing in ASP.NET Core, Angular, and Flutter. View my portfolio and connect with me to build high-quality web and mobile applications."
    />
    <meta
      name="keywords"
      content="Developer, full stack developer, ASP.NET Core, Angular, Flutter, .NET developer, web development, mobile development, portfolio, software engineer, Eslam Mohamed Salah, Eslam Salah"
    />
    <meta name="author" content="Eslam Mohamed Salah" />

    <!-- Favicon - Custom SVG Logo -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.svg" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.svg" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Theme color for browser UI -->
    <meta name="theme-color" content="#0e1f26" />
    <meta name="msapplication-TileColor" content="#0e1f26" />
    <meta name="msapplication-TileImage" content="favicon.svg" />

    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />

    <!-- Archivo (variable width + weight) for all type; Plex Mono for measured
         values only. Loaded render-blocking: the hero headline is set in
         expanded Archivo, and swapping in from a fallback would reflow it. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />

    <!-- Load Font Awesome asynchronously -->
    <link
      rel="preload"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    /></noscript>

    <!-- Critical inline CSS for immediate rendering -->
    <style>
      /* Loader — petrol ground, one amber progress rule, no spinners.
         IDs are driven by assets/js/optimization.js; keep them. */
      body {
        font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        margin: 0;
        padding: 0;
        background: #0e1f26;
        color: #eef2f1;
        line-height: 1.55;
      }

      app-root {
        display: block;
        min-height: 100vh;
      }

      .global-loader {
        position: fixed;
        inset: 0;
        background: #0e1f26;
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        z-index: 99999;
        padding: 0 clamp(1.5rem, 6vw, 7rem) clamp(3rem, 10vh, 7rem);
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }

      .global-loader.loaded {
        opacity: 0;
        visibility: hidden;
      }

      .loader-container {
        width: 100%;
        max-width: 46rem;
      }

      .loader-mark {
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 800;
        font-variation-settings: "wdth" 118;
        letter-spacing: -0.02em;
        line-height: 1;
        color: #eef2f1;
        margin: 0 0 0.6rem;
      }

      .loader-status {
        font-size: 0.875rem;
        color: #7b8d94;
        margin: 0 0 1.5rem;
      }

      /* Progress: a single hairline rule that fills in amber. */
      .progress-bar {
        width: 100%;
        height: 2px;
        background: rgba(238, 242, 241, 0.14);
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: #e39a2b;
        transition: width 0.3s ease;
      }

      .progress-percent {
        display: inline-block;
        margin-top: 0.6rem;
        font-family: "IBM Plex Mono", Consolas, monospace;
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        color: #a8b8bd;
      }

      @media (prefers-reduced-motion: reduce) {
        .global-loader,
        .progress-fill {
          transition: none;
        }
      }
    </style>

    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KVN52WB6CX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-KVN52WB6CX');
</script>

    <!-- Defer Bootstrap JS to not block initial render -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Inline script for immediate loading control -->
    <script>
      // Immediate loading script - runs before any other scripts
      (function () {
        // Ensure loader is visible immediately
        document.addEventListener("DOMContentLoaded", function () {
          const loader = document.getElementById("global-loader");
          if (loader) {
            loader.style.display = "flex";
          }
        });

        // Backup timeout to hide loader if something goes wrong
        setTimeout(function () {
          const loader = document.getElementById("global-loader");
          if (loader && !loader.classList.contains("loaded")) {
            loader.classList.add("loaded");
          }
        }, 8000); // Maximum 8 seconds loading time
      })();
    </script>
  </head>
  <body>
    <!-- Loading screen: name, status, one amber progress rule. -->
    <div id="global-loader" class="global-loader">
      <div class="loader-container">
        <p class="loader-mark">Eslam Salah</p>
        <p class="loader-status" id="loading-status">Loading</p>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-percent" id="progress-percent">0%</span>
      </div>
    </div>

    <app-root></app-root>
  </body>
</html>
