<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio - Eslam Salah</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Eslam Mohamed Salah - Full Stack .NET Developer specializing in ASP.NET Core, Angular, and Flutter. View my portfolio and connect with me to build high-quality web and mobile applications."
    />
    <meta
      name="keywords"
      content="Developer, full stack developer, ASP.NET Core, Angular, Flutter, .NET developer, web development, mobile development, portfolio, software engineer, Eslam Mohamed Salah, Eslam Salah"
    />
    <meta name="author" content="Eslam Mohamed Salah" />

    <!-- Favicon - Custom SVG Logo -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.svg" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.svg" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Theme color for browser UI -->
    <meta name="theme-color" content="#3f51b5" />
    <meta name="msapplication-TileColor" content="#3f51b5" />
    <meta name="msapplication-TileImage" content="favicon.svg" />

    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />

    <!-- Load Google Fonts asynchronously -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Fira+Code:wght@300;400;500&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Fira+Code:wght@300;400;500&display=swap"
    /></noscript>

    <!-- Load Font Awesome asynchronously -->
    <link
      rel="preload"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    /></noscript>

    <!-- Critical inline CSS for immediate rendering -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: #333;
        line-height: 1.6;
      }
      app-root {
        display: block;
        min-height: 100vh;
      }
      /* Hide FOUC (Flash of Unstyled Content) */
      .async-hide {
        opacity: 0 !important;
      }

      /* Global Loader Styles */
      .global-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      .global-loader.loaded {
        opacity: 0;
        visibility: hidden;
      }

      .loader-container {
        text-align: center;
        color: white;
      }

      .loader-content {
        animation: fadeInUp 1s ease forwards;
      }

      /* Logo Animation */
      .loader-logo {
        margin-bottom: 2rem;
        animation: pulse 2s infinite;
      }

      .logo-circle {
        animation: rotate 3s linear infinite;
        transform-origin: center;
      }

      .logo-text {
        animation: glow 2s ease-in-out infinite alternate;
      }

      .logo-code {
        animation: blink 1.5s ease-in-out infinite;
      }

      /* Spinner Animation */
      .loader-spinner {
        position: relative;
        width: 80px;
        height: 80px;
        margin: 0 auto 2rem;
      }

      .spinner-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 3px solid transparent;
        border-top: 3px solid rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .spinner-ring:nth-child(2) {
        width: 90%;
        height: 90%;
        top: 5%;
        left: 5%;
        animation-duration: 1.5s;
        animation-direction: reverse;
      }

      .spinner-ring:nth-child(3) {
        width: 80%;
        height: 80%;
        top: 10%;
        left: 10%;
        animation-duration: 2s;
      }

      /* Loading Text */
      .loader-text h3 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem 0;
        font-weight: 600;
        animation: fadeInOut 2s ease-in-out infinite;
      }

      .loader-text p {
        font-size: 1rem;
        margin: 0 0 2rem 0;
        opacity: 0.9;
      }

      /* Progress Bar */
      .progress-container {
        width: 250px;
        margin: 0 auto;
      }

      .progress-bar {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 0.5rem;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #fff, #e3f2fd);
        border-radius: 3px;
        width: 0%;
        transition: width 0.3s ease;
        animation: shimmer 2s infinite;
      }

      .progress-percent {
        font-size: 0.9rem;
        opacity: 0.8;
        font-weight: 500;
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        to {
          text-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
        }
      }

      @keyframes blink {
        0%,
        50% {
          opacity: 0.8;
        }
        51%,
        100% {
          opacity: 0.3;
        }
      }

      @keyframes fadeInOut {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      @keyframes shimmer {
        0% {
          background-position: -250px 0;
        }
        100% {
          background-position: 250px 0;
        }
      }

      /* Mobile Responsive */
      @media (max-width: 768px) {
        .loader-logo svg {
          width: 80px;
          height: 80px;
        }

        .loader-spinner {
          width: 60px;
          height: 60px;
        }

        .progress-container {
          width: 200px;
        }

        .loader-text h3 {
          font-size: 1.2rem;
        }
      }
    </style>

    <!-- Defer Bootstrap JS to not block initial render -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Inline script for immediate loading control -->
    <script>
      // Immediate loading script - runs before any other scripts
      (function () {
        // Ensure loader is visible immediately
        document.addEventListener("DOMContentLoaded", function () {
          const loader = document.getElementById("global-loader");
          if (loader) {
            loader.style.display = "flex";
          }
        });

        // Backup timeout to hide loader if something goes wrong
        setTimeout(function () {
          const loader = document.getElementById("global-loader");
          if (loader && !loader.classList.contains("loaded")) {
            loader.classList.add("loaded");
          }
        }, 8000); // Maximum 8 seconds loading time
      })();
    </script>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="global-loader" class="global-loader">
      <div class="loader-container">
        <div class="loader-content">
          <!-- Animated Logo -->
          <div class="loader-logo">
            <svg width="100" height="100" viewBox="0 0 100 100">
              <defs>
                <linearGradient
                  id="loaderGrad"
                  x1="0%"
                  y1="0%"
                  x2="100%"
                  y2="100%"
                >
                  <stop
                    offset="0%"
                    style="stop-color: #3f51b5; stop-opacity: 1"
                  />
                  <stop
                    offset="100%"
                    style="stop-color: #1a237e; stop-opacity: 1"
                  />
                </linearGradient>
              </defs>
              <circle
                cx="50"
                cy="50"
                r="45"
                fill="url(#loaderGrad)"
                stroke="#fff"
                stroke-width="2"
                class="logo-circle"
              />
              <text
                x="50"
                y="65"
                font-size="30"
                fill="white"
                text-anchor="middle"
                font-family="Arial"
                font-weight="bold"
                class="logo-text"
              >
                ES
              </text>
              <text
                x="50"
                y="35"
                font-size="12"
                fill="white"
                text-anchor="middle"
                opacity="0.8"
                class="logo-code"
              >
                &lt;/&gt;
              </text>
            </svg>
          </div>

          <!-- Loading Spinner -->
          <div class="loader-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
          </div>

          <!-- Loading Text -->
          <div class="loader-text">
            <h3>Loading Portfolio</h3>
            <p id="loading-status">Initializing...</p>
          </div>

          <!-- Progress Bar -->
          <div class="progress-container">
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="progress-percent" id="progress-percent">0%</span>
          </div>
        </div>
      </div>
    </div>

    <app-root></app-root>
  </body>
</html>
