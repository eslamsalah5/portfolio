<!-- Navigation Header -->
<nav
  class="navbar navbar-expand-lg navbar-light fixed-top"
  [class.navbar-scrolled]="isScrolled"
>
  <div class="container">
    <a class="navbar-brand fw-bold" (click)="scrollToSection('home', $event)">
      <span class="text-primary">Portfolio</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a
            class="nav-link"
            [class.active]="activeSection === 'home'"
            (click)="scrollToSection('home', $event)"
            >Home</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            [class.active]="activeSection === 'about'"
            (click)="scrollToSection('about', $event)"
            >About</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            [class.active]="activeSection === 'skills'"
            (click)="scrollToSection('skills', $event)"
            >Skills</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            [class.active]="activeSection === 'projects'"
            (click)="scrollToSection('projects', $event)"
            >Projects</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            [class.active]="activeSection === 'contact'"
            (click)="scrollToSection('contact', $event)"
            >Contact</a
          >
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Hero Section -->
<section id="home" class="hero-section">
  <div class="container">
    <div class="row min-vh-100 align-items-center">
      <div class="col-lg-6">
        <div class="hero-content">
          <h1 class="hero-title mb-3">
            Hello, I'm <span class="text-primary">{{ personalInfo.name }}</span>
          </h1>
          <h3 class="hero-subtitle mb-4">{{ personalInfo.title }}</h3>
          <p class="hero-description mb-4">
            Welcome to my portfolio. I'm a passionate full-stack developer
            creating innovative web and mobile solutions.
          </p>
          <div class="hero-buttons">
            <a
              (click)="scrollToSection('about', $event)"
              class="btn btn-primary me-3"
              >Learn More</a
            >
            <a
              (click)="scrollToSection('projects', $event)"
              class="btn btn-outline-primary"
              >View My Work</a
            >
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="hero-image text-center">
          <div class="profile-image-container">
            <img
              [src]="profileImage"
              alt="Profile picture of {{ personalInfo.name }}"
              class="profile-image"
              (error)="profileImage = 'assets/images/profile-placeholder.jpg'"
            />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scroll Down Arrow -->
  <div class="scroll-down">
    <a (click)="scrollToSection('about', $event)">
      <i class="fas fa-chevron-down"></i>
    </a>
  </div>
</section>
