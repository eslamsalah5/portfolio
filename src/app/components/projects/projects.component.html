<!-- Projects Section -->
<section id="projects" class="projects-section py-5">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <h2 class="section-title">My Projects</h2>
        <p class="text-center text-muted mb-5">
          Here are some of my recent works and projects
        </p>
      </div>
    </div>

    <!-- Project Filter -->
    <div class="row mb-4">
      <div class="col-12">
        <div class="project-filters text-center">
          <button
            class="filter-btn"
            [class.active]="activeFilter === 'all'"
            (click)="filterProjects('all')"
          >
            All Projects ({{ getProjectCount("all") }})
          </button>
          <button
            class="filter-btn"
            [class.active]="activeFilter === 'web'"
            (click)="filterProjects('web')"
          >
            Web Apps ({{ getProjectCount("web") }})
          </button>
          <button
            class="filter-btn"
            [class.active]="activeFilter === 'mobile'"
            (click)="filterProjects('mobile')"
          >
            Mobile Apps ({{ getProjectCount("mobile") }})
          </button>
        </div>
      </div>
    </div>

    <!-- Projects Grid -->
    <div class="row" id="projects-grid">
      <!-- Dynamic Projects -->
      <div
        class="col-lg-4 col-md-6 mb-4 project-item"
        *ngFor="let project of filteredProjects"
        [attr.data-category]="getProjectCategory(project)"
      >
        <div class="project-card">
          <div class="project-image">
            <div class="image-placeholder">
              <i
                class="fas fa-3x"
                [ngClass]="{
                  'fa-mobile-alt': getProjectCategory(project) === 'mobile',
                  'fa-globe': getProjectCategory(project) === 'web',
                  'fa-code': getProjectCategory(project) === 'other'
                }"
              ></i>
            </div>
            <div class="project-overlay">
              <div class="project-links">
                <button
                  class="project-link"
                  title="View Details"
                  (click)="viewProjectDetails(project)"
                >
                  <i class="fas fa-info-circle"></i>
                </button>
                <a
                  [href]="project.demoUrl"
                  class="project-link"
                  title="Live Demo"
                  *ngIf="project.demoUrl"
                  target="_blank"
                >
                  <i class="fas fa-external-link-alt"></i>
                </a>
                <a
                  [href]="project.githubUrl"
                  class="project-link"
                  title="View Code"
                  *ngIf="project.githubUrl"
                  target="_blank"
                >
                  <i class="fab fa-github"></i>
                </a>
              </div>
            </div>
          </div>
          <div class="project-content">
            <div class="project-header">
              <h4 class="project-title">{{ project.title }}</h4>
              <span
                class="project-type-badge"
                [ngClass]="getProjectTypeBadgeClass(project.projectType)"
              >
                {{ project.projectType }}
              </span>
            </div>
            <p class="project-description">
              {{ project.description }}
            </p>
            <div class="project-technologies">
              <span class="tech-tag" *ngFor="let tech of project.technologies">
                {{ tech }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
