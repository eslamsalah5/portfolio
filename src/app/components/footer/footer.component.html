<!-- Footer -->
<footer class="footer-section">
  <div class="container">
    <div class="footer-main">
      <div class="footer-identity">
        <p class="footer-name">{{ personalInfo.name }}</p>
        <p class="footer-role">{{ personalInfo.title }}</p>
        <p class="footer-location">{{ personalInfo.location }}</p>
      </div>

      <nav class="footer-nav" aria-label="Sections">
        <h2 class="footer-heading">Sections</h2>
        <ul class="footer-menu">
          <li>
            <a href="#home" (click)="scrollToSection('home', $event)">Home</a>
          </li>
          <li>
            <a href="#about" (click)="scrollToSection('about', $event)">About</a>
          </li>
          <li>
            <a href="#experience" (click)="scrollToSection('experience', $event)"
              >Experience</a
            >
          </li>
          <li>
            <a href="#projects" (click)="scrollToSection('projects', $event)"
              >Projects</a
            >
          </li>
          <li>
            <a href="#skills" (click)="scrollToSection('skills', $event)"
              >Skills</a
            >
          </li>
          <li>
            <a href="#contact" (click)="scrollToSection('contact', $event)"
              >Contact</a
            >
          </li>
        </ul>
      </nav>

      <div class="footer-elsewhere">
        <h2 class="footer-heading">Elsewhere</h2>
        <ul class="footer-menu">
          <li>
            <a [href]="'mailto:' + personalInfo.email">{{
              personalInfo.email
            }}</a>
          </li>
          <li>
            <a [href]="'tel:' + personalInfo.phone" class="num">{{
              personalInfo.phone
            }}</a>
          </li>
          <li>
            <a [href]="personalInfo.linkedin" target="_blank" rel="noopener"
              >LinkedIn</a
            >
          </li>
          <li>
            <a [href]="personalInfo.github" target="_blank" rel="noopener"
              >GitHub</a
            >
          </li>
        </ul>
      </div>
    </div>

    <div class="footer-bottom">
      <p class="copyright">
        &copy; <span class="num">2025</span> {{ personalInfo.name }}
      </p>
      <button type="button" class="to-top" (click)="scrollToTop($event)">
        Back to top
      </button>
    </div>
  </div>
</footer>
