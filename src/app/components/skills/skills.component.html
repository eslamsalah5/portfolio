<!-- Skills -->
<section id="skills" class="section section--paper-2 skills">
  <div class="container">
    <div class="section-head">
      <h2 class="section-title">Skills</h2>
      <p class="section-subtitle">
        What I work with, grouped by where it sits in a system.
      </p>
    </div>

    <div class="skills-layout">
      <!-- Category rail. Doubles as the count summary, so the separate
           "N skills in this category" line is gone. -->
      <nav class="skill-rail" aria-label="Skill categories">
        <button
          type="button"
          class="rail-item"
          *ngFor="let category of skillCategories"
          [class.is-active]="activeCategory === category"
          [attr.aria-pressed]="activeCategory === category"
          (click)="setActiveCategory(category)"
        >
          <span class="rail-name">{{ getCategoryShortName(category) }}</span>
          <span class="rail-count num">{{
            getSkillsByCategory(category).length
          }}</span>
        </button>
      </nav>

      <!-- Dense list, not 98 boxes. -->
      <div class="skill-panel">
        <ul class="skill-list">
          <li class="skill" *ngFor="let skill of activeSkills">
            <i
              *ngIf="!isTextIcon(skill)"
              [class]="getIconClass(skill)"
              class="skill-icon"
              aria-hidden="true"
            ></i>
            <span *ngIf="isTextIcon(skill)" class="skill-icon skill-icon--text" aria-hidden="true">{{
              getIconText(skill)
            }}</span>
            <span class="skill-name">{{ skill.name }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
