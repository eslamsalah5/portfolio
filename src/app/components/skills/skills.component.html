<!-- Skills Section -->
<section id="skills" class="skills-section py-5">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <h2 class="section-title">My Skills</h2>
        <p class="text-center text-muted mb-4">
          Technologies and tools I work with professionally
        </p>
      </div>
    </div>

    <!-- Category Tabs -->
    <div class="row mb-4">
      <div class="col-12">
        <div class="skills-tabs">
          <button
            class="skills-tab-btn"
            *ngFor="let category of skillCategories"
            [class.active]="activeCategory === category"
            (click)="setActiveCategory(category)"
          >
            <i [class]="getCategoryIcon(category)" class="me-2"></i>
            {{ getCategoryShortName(category) }}
          </button>
        </div>
      </div>
    </div>

    <!-- Active Category Skills Grid -->
    <div class="row">
      <div
        class="col-xl-2 col-lg-3 col-md-4 col-sm-6 mb-3"
        *ngFor="let skill of getSkillsByCategory(activeCategory)"
      >
        <div class="skill-card">
          <div class="skill-icon">
            <i
              *ngIf="!isTextIcon(skill)"
              [class]="getIconClass(skill)"
              [style.color]="skill.color"
            ></i>
            <span
              *ngIf="isTextIcon(skill)"
              [style.color]="skill.color"
              class="text-icon"
            >
              {{ getIconText(skill) }}
            </span>
          </div>
          <h5 class="skill-name">{{ skill.name }}</h5>
        </div>
      </div>
    </div>

    <!-- Skills count indicator -->
    <div class="row mt-2">
      <div class="col-12 text-center">
        <small class="text-muted skills-count">
          {{ getSkillsByCategory(activeCategory).length }} skills in this category
        </small>
      </div>
    </div>
  </div>
</section>
