    <!-- Critical inline CSS for immediate rendering -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: #333;
        line-height: 1.6;
      }
      app-root {
        display: block;
        min-height: 100vh;
      }
      /* Hide FOUC (Flash of Unstyled Content) */
      .async-hide {
        opacity: 0 !important;
      }

      /* Global Loader Styles */
      .global-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      .global-loader.loaded {
        opacity: 0;
        visibility: hidden;
      }

      .loader-container {
        text-align: center;
        color: white;
      }

      .loader-content {
        animation: fadeInUp 1s ease forwards;
      }

      /* Logo Animation */
      .loader-logo {
        margin-bottom: 2rem;
        animation: pulse 2s infinite;
      }

      .logo-circle {
        animation: rotate 3s linear infinite;
        transform-origin: center;
      }

      .logo-text {
        animation: glow 2s ease-in-out infinite alternate;
      }

      .logo-code {
        animation: blink 1.5s ease-in-out infinite;
      }

      /* Spinner Animation */
      .loader-spinner {
        position: relative;
        width: 80px;
        height: 80px;
        margin: 0 auto 2rem;
      }

      .spinner-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 3px solid transparent;
        border-top: 3px solid rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .spinner-ring:nth-child(2) {
        width: 90%;
        height: 90%;
        top: 5%;
        left: 5%;
        animation-duration: 1.5s;
        animation-direction: reverse;
      }

      .spinner-ring:nth-child(3) {
        width: 80%;
        height: 80%;
        top: 10%;
        left: 10%;
        animation-duration: 2s;
      }

      /* Loading Text */
      .loader-text h3 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem 0;
        font-weight: 600;
        animation: fadeInOut 2s ease-in-out infinite;
      }

      .loader-text p {
        font-size: 1rem;
        margin: 0 0 2rem 0;
        opacity: 0.9;
      }

      /* Progress Bar */
      .progress-container {
        width: 250px;
        margin: 0 auto;
      }

      .progress-bar {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 0.5rem;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #fff, #e3f2fd);
        border-radius: 3px;
        width: 0%;
        transition: width 0.3s ease;
        animation: shimmer 2s infinite;
      }

      .progress-percent {
        font-size: 0.9rem;
        opacity: 0.8;
        font-weight: 500;
      }

      /* Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        to {
          text-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
        }
      }

      @keyframes blink {
        0%,
        50% {
          opacity: 0.8;
        }
        51%,
        100% {
          opacity: 0.3;
        }
      }

      @keyframes fadeInOut {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      @keyframes shimmer {
        0% {
          background-position: -250px 0;
        }
        100% {
          background-position: 250px 0;
        }
      }

      /* Mobile Responsive */
      @media (max-width: 768px) {
        .loader-logo svg {
          width: 80px;
          height: 80px;
        }

        .loader-spinner {
          width: 60px;
          height: 60px;
        }

        .progress-container {
          width: 200px;
        }

        .loader-text h3 {
          font-size: 1.2rem;
        }
      }
    </style>

    <!-- Defer Bootstrap JS to not block initial render -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Inline script for immediate loading control -->
    <script>
      // Immediate loading script - runs before any other scripts
      (function () {
        // Ensure loader is visible immediately
        document.addEventListener("DOMContentLoaded", function () {
          const loader = document.getElementById("global-loader");
          if (loader) {
            loader.style.display = "flex";
          }
        });

        // Backup timeout to hide loader if something goes wrong
        setTimeout(function () {
          const loader = document.getElementById("global-loader");
          if (loader && !loader.classList.contains("loaded")) {
            loader.classList.add("loaded");
          }
        }, 8000); // Maximum 8 seconds loading time
      })();
    </script>
