    <!-- Critical inline CSS for immediate rendering -->
    <style>
      /* Loader — petrol ground, one amber progress rule, no spinners.
         IDs are driven by assets/js/optimization.js; keep them. */
      body {
        font-family: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        margin: 0;
        padding: 0;
        background: #0e1f26;
        color: #eef2f1;
        line-height: 1.55;
      }

      app-root {
        display: block;
        min-height: 100vh;
      }

      .global-loader {
        position: fixed;
        inset: 0;
        background: #0e1f26;
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        z-index: 99999;
        padding: 0 clamp(1.5rem, 6vw, 7rem) clamp(3rem, 10vh, 7rem);
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }

      .global-loader.loaded {
        opacity: 0;
        visibility: hidden;
      }

      .loader-container {
        width: 100%;
        max-width: 46rem;
      }

      .loader-mark {
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        font-weight: 800;
        font-variation-settings: "wdth" 118;
        letter-spacing: -0.02em;
        line-height: 1;
        color: #eef2f1;
        margin: 0 0 0.6rem;
      }

      .loader-status {
        font-size: 0.875rem;
        color: #7b8d94;
        margin: 0 0 1.5rem;
      }

      /* Progress: a single hairline rule that fills in amber. */
      .progress-bar {
        width: 100%;
        height: 2px;
        background: rgba(238, 242, 241, 0.14);
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: #e39a2b;
        transition: width 0.3s ease;
      }

      .progress-percent {
        display: inline-block;
        margin-top: 0.6rem;
        font-family: "IBM Plex Mono", Consolas, monospace;
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        color: #a8b8bd;
      }

      @media (prefers-reduced-motion: reduce) {
        .global-loader,
        .progress-fill {
          transition: none;
        }
      }
    </style>

    <!-- Inline script for immediate loading control -->
    <script>
      // Immediate loading script - runs before any other scripts
      (function () {
        // Ensure loader is visible immediately
        document.addEventListener("DOMContentLoaded", function () {
          const loader = document.getElementById("global-loader");
          if (loader) {
            loader.style.display = "flex";
          }
        });

        // Backup timeout to hide loader if something goes wrong
        setTimeout(function () {
          const loader = document.getElementById("global-loader");
          if (loader && !loader.classList.contains("loaded")) {
            loader.classList.add("loaded");
          }
        }, 8000); // Maximum 8 seconds loading time
      })();
