<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="newsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FC466B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3F5EFB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#newsGrad)"/>
  
  <!-- Decorative Elements -->
  <circle cx="120" cy="120" r="70" fill="rgba(255,255,255,0.1)"/>
  <circle cx="700" cy="500" r="90" fill="rgba(255,255,255,0.1)"/>
  <circle cx="680" cy="120" r="50" fill="rgba(255,255,255,0.08)"/>
  
  <!-- Newspaper Card -->
  <rect x="180" y="140" width="440" height="340" rx="20" fill="url(#paperGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="200" y="160" width="400" height="50" rx="10" fill="#FC466B" opacity="0.9"/>
  <text x="400" y="193" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">📰 Daily News</text>
  
  <!-- News Article 1 -->
  <rect x="220" y="230" width="120" height="80" rx="8" fill="#e9ecef"/>
  <rect x="360" y="235" width="220" height="12" rx="6" fill="#dee2e6"/>
  <rect x="360" y="255" width="180" height="8" rx="4" fill="#e9ecef"/>
  <rect x="360" y="270" width="200" height="8" rx="4" fill="#e9ecef"/>
  <rect x="360" y="285" width="160" height="8" rx="4" fill="#e9ecef"/>
  
  <!-- News Article 2 -->
  <rect x="220" y="330" width="120" height="80" rx="8" fill="#e9ecef"/>
  <rect x="360" y="335" width="220" height="12" rx="6" fill="#dee2e6"/>
  <rect x="360" y="355" width="180" height="8" rx="4" fill="#e9ecef"/>
  <rect x="360" y="370" width="200" height="8" rx="4" fill="#e9ecef"/>
  <rect x="360" y="385" width="160" height="8" rx="4" fill="#e9ecef"/>
  
  <!-- News Article 3 -->
  <rect x="220" y="430" width="360" height="12" rx="6" fill="#dee2e6"/>
  <rect x="220" y="450" width="280" height="8" rx="4" fill="#e9ecef"/>
  
  <!-- Decorative News Icon -->
  <g transform="translate(400, 90)">
    <rect x="-30" y="-25" width="60" height="50" rx="5" fill="white" opacity="0.9"/>
    <line x1="-20" y1="-15" x2="20" y2="-15" stroke="#FC466B" stroke-width="3" stroke-linecap="round"/>
    <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#3F5EFB" stroke-width="2" stroke-linecap="round"/>
    <line x1="-20" y1="5" x2="10" y2="5" stroke="#3F5EFB" stroke-width="2" stroke-linecap="round"/>
    <line x1="-20" y1="15" x2="15" y2="15" stroke="#3F5EFB" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="530" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">News App</text>
  <text x="400" y="565" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.9)" text-anchor="middle">Flutter News Reader</text>
</svg>