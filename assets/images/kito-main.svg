<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="kitoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#56ab2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8e063;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="foodGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a6f;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#kitoGrad)"/>
  
  <!-- Decorative Elements -->
  <circle cx="150" cy="120" r="70" fill="rgba(255,255,255,0.1)"/>
  <circle cx="680" cy="480" r="90" fill="rgba(255,255,255,0.1)"/>
  <circle cx="700" cy="150" r="50" fill="rgba(255,255,255,0.08)"/>
  
  <!-- Phone Mockup -->
  <g filter="url(#shadow)">
    <rect x="280" y="100" width="240" height="440" rx="30" fill="#1a1a2e" stroke="white" stroke-width="3"/>
    <rect x="295" y="125" width="210" height="390" rx="20" fill="white"/>
  </g>
  
  <!-- App Header -->
  <rect x="310" y="140" width="180" height="45" rx="12" fill="url(#kitoGrad)"/>
  <text x="400" y="168" font-family="Arial" font-size="20" font-weight="bold" fill="white" text-anchor="middle">🥗 Kito</text>
  
  <!-- Search Bar -->
  <rect x="315" y="200" width="170" height="30" rx="15" fill="#f8f9fa"/>
  <text x="330" y="220" font-family="Arial" font-size="12" fill="#999" text-anchor="start">Search healthy meals...</text>
  
  <!-- Meal Card 1 -->
  <g>
    <rect x="315" y="245" width="170" height="90" rx="12" fill="#f8f9fa"/>
    <!-- Plate -->
    <ellipse cx="360" cy="275" rx="30" ry="28" fill="url(#plateGrad)"/>
    <!-- Food Items -->
    <circle cx="355" cy="270" r="8" fill="#ff6b6b"/>
    <circle cx="365" cy="270" r="8" fill="#4ecdc4"/>
    <circle cx="360" cy="280" r="8" fill="#ffd93d"/>
    <ellipse cx="360" cy="275" rx="12" ry="8" fill="#56ab2f" opacity="0.7"/>
    
    <!-- Meal Info -->
    <text x="400" y="265" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="start">Healthy Bowl</text>
    <text x="400" y="280" font-family="Arial" font-size="10" fill="#666" text-anchor="start">🔥 320 cal</text>
    <text x="400" y="293" font-family="Arial" font-size="10" fill="#666" text-anchor="start">⚖️ 25g protein</text>
    
    <!-- Price -->
    <rect x="400" y="305" width="70" height="22" rx="11" fill="#56ab2f"/>
    <text x="435" y="320" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">$12.99</text>
  </g>
  
  <!-- Meal Card 2 -->
  <g>
    <rect x="315" y="350" width="170" height="90" rx="12" fill="#f8f9fa"/>
    <!-- Plate -->
    <ellipse cx="360" cy="380" rx="30" ry="28" fill="url(#plateGrad)"/>
    <!-- Salad -->
    <circle cx="350" cy="375" r="7" fill="#56ab2f"/>
    <circle cx="360" cy="375" r="7" fill="#a8e063"/>
    <circle cx="370" cy="375" r="7" fill="#4ecdc4"/>
    <circle cx="355" cy="385" r="7" fill="#ff6b6b"/>
    <circle cx="365" cy="385" r="7" fill="#ffd93d"/>
    
    <!-- Meal Info -->
    <text x="400" y="370" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="start">Fresh Salad</text>
    <text x="400" y="385" font-family="Arial" font-size="10" fill="#666" text-anchor="start">🔥 180 cal</text>
    <text x="400" y="398" font-family="Arial" font-size="10" fill="#666" text-anchor="start">⚖️ 12g protein</text>
    
    <!-- Price -->
    <rect x="400" y="410" width="70" height="22" rx="11" fill="#56ab2f"/>
    <text x="435" y="425" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">$8.99</text>
  </g>
  
  <!-- Bottom Navigation -->
  <rect x="310" y="470" width="180" height="35" rx="17" fill="#f8f9fa"/>
  <g transform="translate(340, 487)">
    <circle cx="0" cy="0" r="10" fill="#56ab2f"/>
    <text x="0" y="4" font-family="Arial" font-size="14" fill="white" text-anchor="middle">🏠</text>
  </g>
  <g transform="translate(400, 487)">
    <circle cx="0" cy="0" r="10" fill="#e9ecef"/>
    <text x="0" y="4" font-family="Arial" font-size="14" fill="#999" text-anchor="middle">🔍</text>
  </g>
  <g transform="translate(460, 487)">
    <circle cx="0" cy="0" r="10" fill="#e9ecef"/>
    <text x="0" y="4" font-family="Arial" font-size="14" fill="#999" text-anchor="middle">🛒</text>
  </g>
  
  <!-- Cart Badge -->
  <circle cx="470" cy="477" r="7" fill="#ff6b6b"/>
  <text x="470" y="481" font-family="Arial" font-size="9" font-weight="bold" fill="white" text-anchor="middle">2</text>
  
  <!-- Decorative Food Icons -->
  <g transform="translate(600, 280)" opacity="0.9">
    <circle cx="0" cy="0" r="35" fill="white" opacity="0.9"/>
    <text x="0" y="12" font-family="Arial" font-size="40" text-anchor="middle">🥑</text>
  </g>
  
  <g transform="translate(650, 350)" opacity="0.8">
    <circle cx="0" cy="0" r="30" fill="white" opacity="0.8"/>
    <text x="0" y="10" font-family="Arial" font-size="35" text-anchor="middle">🥗</text>
  </g>
  
  <g transform="translate(180, 350)" opacity="0.85">
    <circle cx="0" cy="0" r="32" fill="white" opacity="0.85"/>
    <text x="0" y="11" font-family="Arial" font-size="37" text-anchor="middle">🍎</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="570" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">Kito - Healthy Restaurant</text>
</svg>