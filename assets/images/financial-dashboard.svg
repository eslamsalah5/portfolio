<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#finGrad)"/>
  
  <!-- Decorative Elements -->
  <circle cx="150" cy="100" r="60" fill="rgba(255,255,255,0.1)"/>
  <circle cx="680" cy="480" r="80" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Dashboard Card -->
  <rect x="120" y="120" width="560" height="360" rx="20" fill="rgba(255,255,255,0.95)"/>
  
  <!-- Chart Bars -->
  <rect x="180" y="320" width="60" height="100" rx="8" fill="url(#chartGrad)"/>
  <rect x="270" y="280" width="60" height="140" rx="8" fill="url(#chartGrad)"/>
  <rect x="360" y="250" width="60" height="170" rx="8" fill="url(#chartGrad)"/>
  <rect x="450" y="300" width="60" height="120" rx="8" fill="url(#chartGrad)"/>
  <rect x="540" y="270" width="60" height="150" rx="8" fill="url(#chartGrad)"/>
  
  <!-- Chart Line -->
  <polyline points="210,320 300,280 390,250 480,300 570,270" 
            stroke="#ff6b6b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Data Points -->
  <circle cx="210" cy="320" r="8" fill="#ff6b6b"/>
  <circle cx="300" cy="280" r="8" fill="#ff6b6b"/>
  <circle cx="390" cy="250" r="8" fill="#ff6b6b"/>
  <circle cx="480" cy="300" r="8" fill="#ff6b6b"/>
  <circle cx="570" cy="270" r="8" fill="#ff6b6b"/>
  
  <!-- Stats Cards -->
  <rect x="180" y="160" width="120" height="60" rx="10" fill="#667eea" opacity="0.9"/>
  <text x="240" y="185" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Revenue</text>
  <text x="240" y="205" font-family="Arial" font-size="18" fill="white" text-anchor="middle" font-weight="bold">$24.5K</text>
  
  <rect x="340" y="160" width="120" height="60" rx="10" fill="#38ef7d" opacity="0.9"/>
  <text x="400" y="185" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Growth</text>
  <text x="400" y="205" font-family="Arial" font-size="18" fill="white" text-anchor="middle" font-weight="bold">+23%</text>
  
  <rect x="500" y="160" width="120" height="60" rx="10" fill="#ff6b6b" opacity="0.9"/>
  <text x="560" y="185" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Users</text>
  <text x="560" y="205" font-family="Arial" font-size="18" fill="white" text-anchor="middle" font-weight="bold">1,234</text>
  
  <!-- Title -->
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Financial Dashboard</text>
  <text x="400" y="550" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.9)" text-anchor="middle">Flutter Responsive UI</text>
</svg>