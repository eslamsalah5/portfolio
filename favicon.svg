<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3f51b5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a237e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#iconGradient)" stroke="#fff" stroke-width="2"/>
  
  <!-- Main Text "ES" -->
  <text x="50" y="65" font-size="30" fill="white" text-anchor="middle" 
        font-family="Arial, sans-serif" font-weight="bold">ES</text>
  
  <!-- Code Symbol -->
  <text x="50" y="35" font-size="12" fill="white" text-anchor="middle" 
        opacity="0.8" font-family="Arial, sans-serif">&lt;/&gt;</text>
</svg>
